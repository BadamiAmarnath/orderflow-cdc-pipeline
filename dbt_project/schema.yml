version: 2

models:
  - name: stg_customers
    description: "Cleaned staging view of customer CDC events"
    columns:
      - name: customer_id
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned staging view of product CDC events"
    columns:
      - name: product_id
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: stg_orders
    description: "Deduplicated staging view of order records"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              values: ['pending', 'shipped', 'delivered', 'cancelled']

  - name: dim_customers_scd2
    description: "SCD Type 2 dimensional model tracking historical customer address/email updates"
    columns:
      - name: customer_key
        description: "Surrogate key for the specific historical version of the customer"
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null

  - name: dim_products_scd2
    description: "SCD Type 2 dimensional model tracking historical product prices and categories"
    columns:
      - name: product_key
        description: "Surrogate key for the specific historical version of the product"
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null

  - name: fct_orders
    description: "Fact table containing all order transactions joined point-in-time with dimension versions"
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null

  - name: agg_daily_sales
    description: "Executive business metrics aggregated per calendar day"
    columns:
      - name: sale_date
        tests:
          - unique
          - not_null
      - name: total_orders
        tests:
          - not_null
